<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forever ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="final.css">

</head>

<div id="effects">

    <div id="fireworks"></div>

    <div id="petals"></div>

    <div id="balloons"></div>

</div>

<body>

<!-- Background -->

<div id="stars"></div>

<div class="moon" id="moon"></div>

<div class="overlay"></div>

<!-- Shooting Stars -->

<div id="shootingStars"></div>

<!-- Main Cinema -->

<section class="cinema">

    <!-- Scene Text -->

    <div id="scene"></div>

    <!-- Heart -->

    <div id="heartSection">

        <div id="heart">❤️</div>

        <h1>Happy Birthday</h1>

        <h2>Nanna ❤️</h2>

    </div>

    <!-- Typing -->

    <div id="typingContainer">

        <p id="typingText"></p>

        <span id="cursor">|</span>

    </div>

    <!-- Signature -->

    <div id="signature">

        <br>

        <span>This is from ur Chinnu ❤️</span>

    </div>

    <!-- Ending -->

    <div id="ending">

        This website may end here...

        <br><br>

        But my love for you never will. ❤️

    </div>

    <button id="replay">

        ❤️ Start Our Story Again ❤️

    </button>

</section>

<!-- Fireworks -->

<div id="fireworks"></div>

<!-- Petals -->

<div id="petals"></div>

<!-- Balloons -->

<div id="balloons"></div>

<!-- Secret -->

<div id="secret">

    <div class="secret-card">

        <h2>🌙 Secret</h2>

        <p id="secretMessage"></p>

    </div>

</div>

<!-- Music -->

<audio id="bgMusic" loop>

    <source src="music.mp3" type="audio/mpeg">

</audio>
<div id="lastQuote"></div>
<script src="final.js"></script>

</body>

</html>
